<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0015;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Inner circle with fractal pattern -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#neonGradient)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Mandelbrot-inspired fractal circles -->
  <circle cx="70" cy="80" r="20" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
  <circle cx="130" cy="80" r="20" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
  <circle cx="100" cy="130" r="18" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
  
  <!-- Center star/symbol -->
  <g transform="translate(100, 100)">
    <!-- 8-pointed star representing 8 symbols -->
    <path d="M 0,-30 L 10,-10 L 30,0 L 10,10 L 0,30 L -10,10 L -30,0 L -10,-10 Z" fill="url(#neonGradient)" filter="url(#glow)"/>
    
    <!-- Inner rotating square -->
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.8" filter="url(#glow)" transform="rotate(45)"/>
  </g>
  
  <!-- Brainfuck symbols around the circle (decorative) -->
  <text x="100" y="40" font-family="monospace" font-size="10" fill="#ff00ff" text-anchor="middle" font-weight="bold" filter="url(#glow)">&gt;</text>
  <text x="160" y="105" font-family="monospace" font-size="10" fill="#00ffff" text-anchor="middle" font-weight="bold" filter="url(#glow)">&lt;</text>
  <text x="100" y="165" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" font-weight="bold" filter="url(#glow)">+</text>
  <text x="40" y="105" font-family="monospace" font-size="10" fill="#ff00ff" text-anchor="middle" font-weight="bold" filter="url(#glow)">-</text>
  
  <!-- Smaller symbols in between -->
  <text x="140" y="55" font-family="monospace" font-size="8" fill="#00ffff" text-anchor="middle" opacity="0.7" filter="url(#glow)">[</text>
  <text x="60" y="55" font-family="monospace" font-size="8" fill="#00ff88" text-anchor="middle" opacity="0.7" filter="url(#glow)">]</text>
  <text x="145" y="150" font-family="monospace" font-size="8" fill="#ff00ff" text-anchor="middle" opacity="0.7" filter="url(#glow)">,</text>
  <text x="55" y="150" font-family="monospace" font-size="8" fill="#00ffff" text-anchor="middle" opacity="0.7" filter="url(#glow)">.</text>
  
  <!-- Ultra-bright center dot -->
  <circle cx="100" cy="100" r="3" fill="#ffffff" filter="url(#glow)"/>
</svg>
